name: Lighthouse mobile audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://nusakaracreative.github.io/nusakaracreative/
            https://nusakaracreative.github.io/nusakaracreative/portfolio/
            https://nusakaracreative.github.io/nusakaracreative/work/jaya-mediacell/
            https://nusakaracreative.github.io/nusakaracreative/work/imworks/
          uploadArtifacts: true
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
