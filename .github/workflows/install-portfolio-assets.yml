name: Install portfolio assets

on:
  push:
    paths:
      - "NUSAKARA_PORTFOLIO_GITHUB_ASSETS.zip"
      - ".github/workflows/install-portfolio-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract portfolio assets
        run: |
          rm -rf /tmp/nusakara-assets
          mkdir -p /tmp/nusakara-assets
          mkdir -p assets/portfolio
          if [ -f "NUSAKARA_PORTFOLIO_GITHUB_ASSETS.zip" ]; then
            unzip -q "NUSAKARA_PORTFOLIO_GITHUB_ASSETS.zip" -d /tmp/nusakara-assets
            cp -R /tmp/nusakara-assets/commercial assets/portfolio/
            cp -R /tmp/nusakara-assets/food-beverage assets/portfolio/
            cp -R /tmp/nusakara-assets/hunting assets/portfolio/
          fi

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate responsive WebP variants
        run: |
          find . -type f -name "*.webp" ! -name "*-480.webp" ! -name "*-800.webp" ! -name "*-1200.webp" -print0 | while IFS= read -r -d '' file; do
            base="${file%.webp}"
            magick "$file" -strip -resize "480x480>" -quality 78 "${base}-480.webp"
            magick "$file" -strip -resize "800x800>" -quality 80 "${base}-800.webp"
            magick "$file" -strip -resize "1200x1200>" -quality 82 "${base}-1200.webp"
          done

      - name: Commit portfolio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "*.webp"
          git diff --cached --quiet && exit 0
          git commit -m "Add NUSAKARA portfolio photo assets"
          git push
