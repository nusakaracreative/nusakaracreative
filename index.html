<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D2129">
<title>NUSAKARA CREATIVE — Website Ditutup Sementara</title>
<meta name="description" content="Website NUSAKARA CREATIVE sedang ditutup sementara.">
<style>
:root{color-scheme:dark;--ink:#0D2129;--deep:#033040;--orange:#FA3E0B;--paper:#F3F0E9;--muted:#aeb9bc}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(100%,760px);padding:clamp(28px,7vw,76px);border:1px solid rgba(243,240,233,.2);background:linear-gradient(145deg,var(--deep),var(--ink) 70%);position:relative;overflow:hidden}
main:before{content:"";position:absolute;width:190px;height:6px;background:var(--orange);top:0;left:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#ff7655}
h1{font-size:clamp(42px,8vw,82px);line-height:.98;letter-spacing:-.065em;margin:34px 0 24px;font-weight:800}
p{font-size:clamp(15px,2.4vw,18px);line-height:1.7;color:var(--muted);max-width:540px;margin:0}
.rule{height:1px;background:rgba(243,240,233,.2);margin:42px 0 20px}
footer{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer strong{color:var(--paper);font-weight:700}
</style>
</head>
<body>
<main>
<div class="eyebrow">NUSAKARA CREATIVE · Notice</div>
<h1>Website ditutup sementara.</h1>
<p>Untuk saat ini, website NUSAKARA CREATIVE tidak tersedia untuk kunjungan publik. Informasi lebih lanjut akan disampaikan melalui kanal komunikasi resmi NUSAKARA CREATIVE.</p>
<div class="rule"></div>
<footer><strong>Creative &amp; Digital Growth Partner</strong><span>Bandung, Indonesia</span></footer>
</main>
</body>
</html>
